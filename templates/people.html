<!DOCTYPE html>
<html>
<head>
    <title>Registered People</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>👥 Registered People</h1>
        <div class="nav-links">
            <a href="/admin">← Back to Dashboard</a>
        </div>

        <div class="card">
            <table>
                <tr><th>Name</th><th>Action</th></tr>
                {% for person in people %}
                <tr>
                    <td>{{ person }}</td>
                    <td>
                        <form method="POST" action="/admin/people/delete/{{ person }}" onsubmit="return confirm('Remove {{ person }}?');" style="margin:0;"><input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
                            <button type="submit" class="btn btn-danger">Remove</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </table>
        </div>
    </div>
</body>
</html>
