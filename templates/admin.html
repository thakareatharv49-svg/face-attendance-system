<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>📋 Admin Dashboard</h1>
        <p class="subtitle">Manage attendance and registered people</p>

        <div class="nav-links">
            <a href="/admin/register">➕ Register New Person</a>
            <a href="/admin/people">👥 Manage People</a>
            <a href="/logout">🚪 Logout</a>
        </div>

        <div class="card">
            <h2 style="margin-top:0;">Attendance Records</h2>
            <table>
                <tr><th>Name</th><th>Timestamp</th></tr>
                {% for record in records %}
                <tr><td>{{ record[1] }}</td><td>{{ record[2] }}</td></tr>
                {% endfor %}
            </table>
        </div>
    </div>
</body>
</html>
