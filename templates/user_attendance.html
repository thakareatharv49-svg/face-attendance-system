<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Attendance History</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><main class="container"><h1>My attendance history</h1><p class="subtitle">{{ person_name }} · Personal records only</p><nav class="nav-links"><a href="{{ url_for('user_dashboard') }}">← Overview</a><a href="{{ url_for('user_calendar') }}">Calendar</a><a href="{{ url_for('user_profile') }}">My profile</a><a href="{{ url_for('logout') }}">Logout</a></nav><section class="card"><div class="table-wrap"><table><thead><tr><th>Date</th><th>Time</th><th>Status</th></tr></thead><tbody>{% for row in records %}<tr><td>{{ row[2][:10] }}</td><td>{{ row[2][11:] }}</td><td><span class="pill-present">Present</span></td></tr>{% else %}<tr><td colspan="3">No attendance records yet.</td></tr>{% endfor %}</tbody></table></div></section></main></body></html>
