<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · AI Attendance</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><main class="login-wrapper"><section class="card login-box"><p class="eyebrow">AI FACE ATTENDANCE</p><h1>Welcome back</h1><p class="muted">Sign in to your attendance portal.</p>{% if error %}<p class="notice error-text">{{ error }}</p>{% endif %}
<form method="POST"><label>Username<input type="text" name="username" autocomplete="username" required autofocus></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button type="submit" class="btn btn-primary full-width">Sign in</button></form><p class="muted small">Admin and registered users use the same sign-in page.</p><a href="{{ url_for('index') }}">← Back to attendance kiosk</a></section></main></body></html>
