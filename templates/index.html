<!DOCTYPE html>
<html>
<head>
    <title>AI Attendance System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container" style="text-align:center;">
        <h1>🎯 AI Attendance System</h1>
        <p class="subtitle">Look at the camera to mark your attendance</p>

        <video id="video" width="480" height="360" autoplay playsinline></video>
        <canvas id="canvas" width="480" height="360" style="display:none;"></canvas>
        <div id="status" class="status-box">Initializing camera...</div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const status = document.getElementById('status');
        const ctx = canvas.getContext('2d');

        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => {
                video.srcObject = stream;
                status.textContent = "Camera ready. Looking for face...";
            })
            .catch(err => {
                status.textContent = "Camera access denied or unavailable.";
            });

        function captureAndSend() {
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = canvas.toDataURL('image/jpeg', 0.7);

            fetch('/process_frame', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: imageData })
            })
            .then(res => res.json())
            .then(data => {
                status.className = "status-box";
                if (data.names.length === 0) {
                    status.textContent = "No face detected";
                } else {
                    const name = data.names[0];
                    if (name === "Unknown") {
                        status.textContent = "Unknown person";
                        status.classList.add("status-unknown");
                    } else if (data.marked.includes(name)) {
                        status.textContent = `✅ ${name} — Attendance marked (live)`;
                        status.classList.add("status-live");
                    } else {
                        status.textContent = `${name} recognized — please blink to confirm`;
                        status.classList.add("status-waiting");
                    }
                }
            })
            .catch(err => console.error(err));
        }

        setInterval(captureAndSend, 1000);
    </script>
</body>
</html>
