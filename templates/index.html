<!DOCTYPE html>
<html>
<head>
    <title>AI Attendance System</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #1e1e1e; color: white; }
        video, canvas { border-radius: 10px; margin-top: 20px; }
        #status { font-size: 20px; margin-top: 15px; }
        .live { color: #4CAF50; }
        .waiting { color: #FFC107; }
        .unknown { color: #F44336; }
    </style>
</head>
<body>
    <h1>🎯 AI Attendance System</h1>
    <video id="video" width="480" height="360" autoplay playsinline></video>
    <canvas id="canvas" width="480" height="360" style="display:none;"></canvas>
    <div id="status">Initializing camera...</div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const status = document.getElementById('status');
        const ctx = canvas.getContext('2d');

        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => {
                video.srcObject = stream;
                status.textContent = "Camera ready. Looking for face...";
            })
            .catch(err => {
                status.textContent = "Camera access denied or unavailable.";
            });

        function captureAndSend() {
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = canvas.toDataURL('image/jpeg', 0.7);

            fetch('/process_frame', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: imageData })
            })
            .then(res => res.json())
            .then(data => {
                if (data.names.length === 0) {
                    status.textContent = "No face detected";
                    status.className = "";
                } else {
                    const name = data.names[0];
                    if (name === "Unknown") {
                        status.textContent = "Unknown person";
                        status.className = "unknown";
                    } else if (data.marked.includes(name)) {
                        status.textContent = `✅ ${name} - Attendance marked (live)`;
                        status.className = "live";
                    } else {
                        status.textContent = `${name} recognized - please blink to confirm`;
                        status.className = "waiting";
                    }
                }
            })
            .catch(err => console.error(err));
        }

        setInterval(captureAndSend, 1000);  // send a frame every 1 second
    </script>
</body>
</html>
