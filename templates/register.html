<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register person · AttendAI</title><meta name="csrf-token" content="{{ csrf_token() }}"><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body class="admin-body"><header class="topbar"><a class="brand-row" href="{{ url_for('admin_dashboard') }}"><div class="brand-mark">A</div><div><strong>AttendAI</strong><span>ADMIN CONSOLE</span></div></a><a class="text-link" href="{{ url_for('admin_dashboard') }}">← Dashboard</a></header><main class="admin-main narrow"><div class="page-heading"><div><div class="eyebrow">PEOPLE MANAGEMENT</div><h1>Register a person</h1><p class="muted">Capture one clear face to add a person to the recognition list.</p></div></div>{% if message %}<div class="alert error">{{ message }}</div>{% endif %}<section class="panel"><form method="POST" id="register-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="name">Full name</label><input id="name" name="name" type="text" maxlength="60" placeholder="e.g. Ada Lovelace" required><div class="camera-frame register-camera"><video id="video" autoplay playsinline muted></video><div id="placeholder" class="camera-placeholder"><strong>Starting camera…</strong><span>Allow camera access to continue</span></div></div><input type="hidden" name="image" id="image"><div id="camera-error" class="muted small"></div><button class="button primary full" type="submit" id="capture" disabled>Capture face & register →</button></form></section></main><script>
(async()=>{const video=document.getElementById('video'),button=document.getElementById('capture'),placeholder=document.getElementById('placeholder'),error=document.getElementById('camera-error');let stream;try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});video.srcObject=stream;await video.play();placeholder.hidden=true;button.disabled=false;}catch(e){error.textContent='Camera unavailable. Allow camera permission and reload.';}document.getElementById('register-form').addEventListener('submit',e=>{if(!video.videoWidth){e.preventDefault();return;}const c=document.createElement('canvas');c.width=Math.min(video.videoWidth,640);c.height=Math.round(video.videoHeight*c.width/video.videoWidth);c.getContext('2d').drawImage(video,0,0,c.width,c.height);document.getElementById('image').value=c.toDataURL('image/jpeg',0.85);button.disabled=true;button.textContent='Registering…';});window.addEventListener('pagehide',()=>stream?.getTracks().forEach(t=>t.stop()));})();
</script></body></html>
