<!DOCTYPE html>
<html>
<head>
    <title>Register New Person</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container" style="text-align:center;">
        <h1>➕ Register New Person</h1>
        <div class="nav-links" style="justify-content:center;">
            <a href="/admin">← Back to Dashboard</a>
        </div>

        {% if message %}<div class="status-box" style="max-width:400px; margin:0 auto 20px;">{{ message }}</div>{% endif %}

        <video id="video" width="400" height="300" autoplay playsinline></video>
        <canvas id="canvas" width="400" height="300" style="display:none;"></canvas>
        <br>
        <input type="text" id="nameInput" placeholder="Enter person's name" style="max-width:300px;" required>
        <br>
        <button onclick="capture()" class="btn btn-primary">📸 Capture & Register</button>

        <form id="hiddenForm" method="POST" style="display:none;">
            <input type="hidden" name="name" id="hiddenName">
            <input type="hidden" name="image" id="hiddenImage">
        </form>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => { video.srcObject = stream; })
            .catch(err => { alert("Camera access denied."); });

        function capture() {
            const name = document.getElementById('nameInput').value.trim();
            if (!name) {
                alert("Please enter a name first.");
                return;
            }
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = canvas.toDataURL('image/jpeg', 0.9);

            document.getElementById('hiddenName').value = name;
            document.getElementById('hiddenImage').value = imageData;
            document.getElementById('hiddenForm').submit();
        }
    </script>
</body>
</html>
