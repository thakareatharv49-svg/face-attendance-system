<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My profile</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body><main class="container"><header class="page-head"><div><p class="eyebrow">PERSONAL PORTAL</p><h1>My profile</h1><p class="subtitle">Account details and password security.</p></div><a class="btn btn-outline" href="{{ url_for('user_dashboard') }}">← Dashboard</a></header>
<nav class="nav-links"><a href="{{ url_for('user_calendar') }}">Calendar</a><a href="{{ url_for('user_attendance') }}">Attendance history</a><a href="{{ url_for('logout') }}">Logout</a></nav>
<section class="card"><div class="profile-avatar">{{ person_name[:1]|upper }}</div><h2>{{ person_name }}</h2><p class="muted">Username: {{ username }}</p></section>
<section class="card"><h2>Change password</h2>{% if message %}<p class="notice success">{{ message }}</p>{% endif %}{% if error %}<p class="notice error-text">{{ error }}</p>{% endif %}
<form method="post" class="password-form"><input type="hidden" name="_csrf_token" value="{{ csrf_token }}"><label>Current password<input type="password" name="current_password" autocomplete="current-password" required></label><label>New password<input type="password" name="new_password" minlength="8" autocomplete="new-password" required></label><label>Confirm new password<input type="password" name="confirm_password" minlength="8" autocomplete="new-password" required></label><button class="btn btn-primary" type="submit">Update password</button></form></section></main></body></html>
